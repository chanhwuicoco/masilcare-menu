<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<style>html, body { margin: 0; }</style>
<title>마실케어 메뉴 개편안</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 얼개: 위에 붙는 보기 단추(현행 · 1안 · 2안) → 마실케어 화면 모양의 무대(왼쪽 = 살아 있는 메뉴, 오른쪽 = 실제 화면 사진 + 탭 + 메모) */
:root {
  --bg: #f1f4f8; --surface: #ffffff; --sunken: #e7ecf3; --ink: #17202f; --muted: #586478; --line: #d6dde8;
  --brand: #1f3a6e; --brand-ink: #ffffff; --brand-text: #1f3a6e;
  --shadow: 0 1px 2px rgb(20 30 50 / .10), 0 10px 28px rgb(20 30 50 / .12);
  --hit: #e1e9f6;
  /* 「1안」 「2안」 이름 글자 색(남색 바탕 위) — 나머지 색은 모두 같다 */
  --lbl-plan1: #ffd24d; --lbl-plan2: #7fe3c0;
  /* 무대(마실케어 화면을 본뜬 부분)는 화면 사진과 맞추려고 늘 밝은 색이다 */
  --app-navy: #1f3a6e; --app-navy-ink: #ffffff; --app-navy-line: rgb(255 255 255 / .42);
  --app-surface: #ffffff; --app-sub: #f7f9fc; --app-bg: #f3f5f8; --app-line: #d9dee5; --app-ink: #1c2433; --app-muted: #5b6675; --app-active: #e6ecf5;
  --app-note: #fff7d6; --app-note-line: #e6cf7a; --app-new: #8a5200; --app-new-bg: #ffefc9;
  --app-shadow: 0 2px 4px rgb(20 30 50 / .12), 0 12px 30px rgb(20 30 50 / .18);
  --chip-s: 80%; --chip-l: 94%; --bar-s: 58%; --bar-l: 45%;
  --font: "IBM Plex Sans KR", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e131c; --surface: #171e2b; --sunken: #111823; --ink: #e6ebf4; --muted: #9aa6ba; --line: #2b3547;
    --brand: #34589f; --brand-ink: #ffffff; --brand-text: #a9c4f6;
    --shadow: 0 1px 2px rgb(0 0 0 / .45), 0 12px 30px rgb(0 0 0 / .4);
    --hit: #223250;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e131c; --surface: #171e2b; --sunken: #111823; --ink: #e6ebf4; --muted: #9aa6ba; --line: #2b3547;
  --brand: #34589f; --brand-ink: #ffffff; --brand-text: #a9c4f6;
  --shadow: 0 1px 2px rgb(0 0 0 / .45), 0 12px 30px rgb(0 0 0 / .4);
  --hit: #223250;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
h1, h2, h3, h4, p, dl, ul { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brand-text); outline-offset: 2px; }
.gutter { max-width: 1660px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.code { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* 지금 대메뉴 색 — 화면이 어디에서 왔는지 */
.o1 { --h: 218; } .o2 { --h: 192; } .o3 { --h: 162; } .o4 { --h: 128; } .o5 { --h: 84; } .o6 { --h: 46; }
.o7 { --h: 22; } .o8 { --h: 350; } .o9 { --h: 318; } .o10 { --h: 284; } .o11 { --h: 250; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: hsl(var(--h) var(--bar-s) var(--bar-l)); flex: none; display: inline-block; }

/* 위에 붙는 줄 */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 90%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.bar-in { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding-block: 10px; }
.bar h1 { font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
.seg { display: inline-flex; background: var(--sunken); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { font-weight: 600; font-size: 14px; padding: 6px 16px; border: 0; background: transparent; color: var(--muted); border-radius: 7px; cursor: pointer; display: inline-flex; gap: 6px; align-items: baseline; transition: background-color .25s, color .25s; }
.seg button small { font-family: var(--mono); font-size: 11.5px; font-weight: 500; opacity: .85; }
.seg button[aria-selected="true"] { background: var(--brand); color: var(--brand-ink); }

main { padding-block: 18px 64px; display: flex; flex-direction: column; gap: 14px; }
.intro { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 18px; }
.lead { font-size: 15.5px; }
.stat { color: var(--muted); font-size: 13.5px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--muted); }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.foot { color: var(--muted); font-size: 12.5px; max-width: 96ch; }

/* 대메뉴만 나란히 — 왼쪽 1안 · 가운데 현행 · 오른쪽 2안의 왼쪽 메뉴(대메뉴만). 대메뉴를 누르면 옮겨 가는 화면을 사이에 상자로 뽑아 선으로 잇는다 */
.cmp { display: flex; flex-direction: column; gap: 12px; }
.cmp-say { font-size: 15.5px; }
.cmp-say b { color: var(--brand-text); }
.cmp-say button { margin-left: 8px; font-size: 13px; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 1px 9px; cursor: pointer; }
.stage.cmp-stage { aspect-ratio: auto; background: #c9d1dd; }
.cmp-wins { position: relative; display: flex; align-items: stretch; padding: calc(var(--u) * 12); min-height: calc(var(--u) * 620); }
.cmp-win { position: relative; z-index: 1; flex: none; width: calc(var(--u) * 196); overflow: hidden; border-radius: calc(var(--u) * 8); background: var(--app-surface); box-shadow: var(--app-shadow); }
.cmp-win, .cmp-lane { --win: var(--app-navy); --lbl: #fff; }
.cmp-win[data-v="plan1"], .cmp-lane[data-v="plan1"] { --lbl: var(--lbl-plan1); }
.cmp-win[data-v="plan2"], .cmp-lane[data-v="plan2"] { --lbl: var(--lbl-plan2); }
.cmp-head { height: calc(var(--u) * 50); display: flex; align-items: baseline; gap: calc(var(--u) * 9); padding: calc(var(--u) * 9) calc(var(--u) * 12) 0; background: var(--win); color: var(--lbl); font-weight: 800; font-size: calc(var(--u) * 24); line-height: 1.2; }
.cmp-head span { font-size: calc(var(--u) * 12.5); font-weight: 500; color: #fff; opacity: .88; }
.cmp-sub { padding: calc(var(--u) * 7) calc(var(--u) * 10); border-bottom: 1px solid var(--app-line); font-size: calc(var(--u) * 12); color: var(--app-muted); }
.cmp-row { transition: background-color .25s; font-size: calc(var(--u) * 13.5); padding-left: calc(var(--u) * 9); padding-right: calc(var(--u) * 9); }
.cmp-row > * { transition: opacity .25s; }
.cmp-row:hover { background: var(--app-active); }
.cmp-row.rel { background: color-mix(in srgb, var(--win) 13%, white); color: var(--win); box-shadow: inset calc(var(--u) * 4) 0 0 var(--win); }
.cmp-row.sel { background: var(--win); color: #fff; }
.cmp-row.sel .who, .cmp-row.sel .cnt, .cmp-row.sel .chev { color: inherit; opacity: .85; }
.cmp.picked .cmp-row:not(.sel):not(.rel) > * { opacity: .36; }
/* 사이 칸 — 두 단: 개편안 쪽 단에는 개편 화면, 현행 쪽 단에는 현행 화면 상자(자리는 이어진 대메뉴 줄 높이에 맞춰 스크립트가 정한다) */
.cmp-link { position: relative; z-index: 1; flex: 1; min-width: 0; display: flex; }
.cmp-lane { position: relative; flex: 1; min-width: 0; }
.cmp-cap { position: absolute; top: 0; left: 0; right: 0; text-align: center; font-size: calc(var(--u) * 12.5); font-weight: 700; }
.cmp-cap span { display: inline-block; background: var(--win); color: var(--lbl); border-radius: 999px; padding: calc(var(--u) * 1) calc(var(--u) * 11); }
.cmp-box { position: absolute; top: 0; left: calc(var(--u) * 16); right: calc(var(--u) * 16); background: var(--app-surface); border: calc(var(--u) * 2) solid var(--win); border-radius: calc(var(--u) * 8); box-shadow: 0 1px 3px rgb(20 30 50 / .18); padding: calc(var(--u) * 6) calc(var(--u) * 8) calc(var(--u) * 7); color: var(--app-ink); font-size: calc(var(--u) * 12.5); line-height: 1.35; animation: rise-in .35s ease both; }
.cmp-lane:first-child .cmp-box { left: calc(var(--u) * 26); right: calc(var(--u) * 34); }
.cmp-lane:last-child .cmp-box { left: calc(var(--u) * 34); right: calc(var(--u) * 26); }
.cmp-box h4 { display: flex; align-items: baseline; justify-content: space-between; gap: calc(var(--u) * 6); font-size: calc(var(--u) * 13); color: var(--win); margin-bottom: calc(var(--u) * 3); }
.cmp-box h4 small { flex: none; font-size: calc(var(--u) * 11.5); font-weight: 600; }
.cmp-box ul { list-style: none; padding: 0; display: flex; flex-direction: column; gap: calc(var(--u) * 1); }
.cmp-box li { --tone: var(--app-navy); display: flex; align-items: baseline; gap: calc(var(--u) * 5); padding: calc(var(--u) * 1.5) calc(var(--u) * 3) calc(var(--u) * 1.5) calc(var(--u) * 7); box-shadow: inset calc(var(--u) * 3) 0 0 var(--tone); border-radius: calc(var(--u) * 3); transition: background-color .15s; }
.cmp-box li .code { flex: none; min-width: calc(var(--u) * 31); font-size: calc(var(--u) * 10.5); color: var(--app-muted); }
.cmp-box li .nm { min-width: 0; overflow-wrap: anywhere; }
.cmp-box li .tag { flex: none; margin-left: auto; font-size: calc(var(--u) * 10.5); font-weight: 700; color: var(--tone); white-space: nowrap; }
.cmp-box li.is-new { background: var(--app-new-bg); }
.cmp-box li { transition: background-color .15s, opacity .15s; }
.cmp-wins.focusing .cmp-box li:not(.hot) { opacity: .38; }
.cmp-box li.hot { background: color-mix(in srgb, var(--tone) 18%, white); }
.cmp-lines { position: absolute; left: 0; top: 0; z-index: 0; pointer-events: none; overflow: visible; }
.cmp-lines path { fill: none; stroke: var(--app-navy); stroke-width: 2; stroke-linecap: round; stroke-dasharray: 1; animation: cmp-draw .5s ease both; transition: opacity .15s; }
.cmp-lines path.pair { stroke-width: 1.6; opacity: .85; }
.cmp-lines.focus path.pair { opacity: .1; }
.cmp-lines.focus path.pair.hot { opacity: 1; stroke-width: 2.4; }
.cmp-lines circle { fill: var(--app-navy); }
.cmp-lines.still path { animation: none; }
/* 그림 아래 설명 — 구성 개요 표 + 화면별 표 */
.ci { display: flex; flex-direction: column; gap: 10px; }
.ci h2 { font-size: 19px; margin-top: 4px; }
.ci h2 .tag { display: inline-block; margin-right: 8px; font-size: 13px; font-weight: 700; color: var(--brand-ink); background: var(--brand); border-radius: 5px; padding: 1px 8px; vertical-align: 2px; }
.ci h3 { font-size: 15px; margin-top: 8px; }
.ci-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); }
.ci-t { width: 100%; border-collapse: collapse; font-size: 14px; line-height: 1.5; }
.ci-t th, .ci-t td { padding: 8px 12px; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); text-align: left; vertical-align: top; }
.ci-t tr > :last-child { border-right: 0; }
.ci-t tbody tr:last-child > * { border-bottom: 0; }
.ci-t thead th { background: var(--sunken); font-weight: 600; font-size: 13px; color: var(--muted); white-space: nowrap; }
.ci-t tbody th { background: var(--sunken); font-weight: 600; white-space: nowrap; }
.ci-t.wide { min-width: 860px; }
.ci-t .code { font-size: 12px; color: var(--brand-text); margin-right: 6px; }
.ci-t .name { font-weight: 600; }
.ci-t .kind { display: inline-block; margin-left: 6px; font-size: 11.5px; font-weight: 600; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; white-space: nowrap; }
.ci-t .kind.new { color: var(--app-new); background: var(--app-new-bg); border-color: transparent; }
.ci-t .num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.ci-t .sub { color: var(--muted); font-size: 13px; }
.ci-t .none { color: var(--muted); }
.ci-t ul { margin: 0; padding-left: 16px; }
.ci-chips { display: flex; flex-wrap: wrap; gap: 5px; }
.ci-chips span { font-size: 12.5px; background: var(--sunken); border: 1px solid var(--line); border-radius: 999px; padding: 1px 10px; }
.ci-src { font-size: 12.5px; color: var(--muted); }
@keyframes cmp-draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@media (prefers-reduced-motion: reduce) { .cmp-box, .cmp-lines path { animation: none; } .cmp-row, .cmp-row > * { transition: none; } }

/* 무대 — 마실케어 화면(1600 × 1000)을 본뜬 틀. 안의 크기는 모두 틀 너비에 비례한다 */
.stage-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); background: var(--app-bg); }
.stage {
  --u: calc(100cqw / 1600); --chip-s: 80%; --chip-l: 94%; --bar-s: 58%; --bar-l: 45%;
  container-type: inline-size; position: relative; min-width: 1040px; aspect-ratio: 1600 / 1000; overflow: hidden;
  background: var(--app-bg); color: var(--app-ink); line-height: 1.35;
}
.stage .dot { width: calc(var(--u) * 9); height: calc(var(--u) * 9); }
.stage :focus-visible { outline: 2px solid #6f97cb; outline-offset: -2px; }
.app-head { position: absolute; inset: 0 0 auto 0; height: calc(var(--u) * 46); background: var(--app-navy); color: var(--app-navy-ink); display: flex; align-items: center; }
.app-logo { width: calc(var(--u) * 236); flex: none; text-align: center; font-weight: 700; font-size: calc(var(--u) * 17); }
.crumb { display: flex; align-items: baseline; gap: calc(var(--u) * 8); padding-left: calc(var(--u) * 12); font-size: calc(var(--u) * 14.5); min-width: 0; white-space: nowrap; }
.crumb .sep { opacity: .6; }
.crumb b { font-weight: 700; font-size: calc(var(--u) * 15.5); }
.app-mode { margin-left: auto; margin-right: calc(var(--u) * 14); flex: none; font-size: calc(var(--u) * 13.5); font-weight: 700; border: 1px solid var(--app-navy-line); border-radius: 999px; padding: calc(var(--u) * 3) calc(var(--u) * 13); }
.app-mode[data-v="plan1"] { color: var(--lbl-plan1); border-color: var(--lbl-plan1); }
.app-mode[data-v="plan2"] { color: var(--lbl-plan2); border-color: var(--lbl-plan2); }

.side { position: absolute; left: 0; top: calc(var(--u) * 46); bottom: 0; width: calc(var(--u) * 236); background: var(--app-surface); border-right: 1px solid var(--app-line); display: flex; flex-direction: column; }
.side-top { padding: calc(var(--u) * 6); border-bottom: 1px solid var(--app-line); flex: none; }
.all-btn { width: 100%; height: calc(var(--u) * 30); border: 0; border-radius: calc(var(--u) * 4); background: var(--app-navy); color: var(--app-navy-ink); font-weight: 700; font-size: calc(var(--u) * 14.5); cursor: pointer; }
.all-btn[aria-expanded="true"] { background: var(--app-surface); color: var(--app-navy); box-shadow: inset 0 0 0 calc(var(--u) * 1.5) var(--app-navy); }
.menu { flex: 1; min-height: 0; overflow-y: auto; }
.grp-h { display: flex; align-items: center; gap: calc(var(--u) * 8); width: 100%; min-height: calc(var(--u) * 37.6); padding: calc(var(--u) * 5) calc(var(--u) * 10); border: 0; border-bottom: 1px solid var(--app-line); background: transparent; color: var(--app-ink); text-align: left; cursor: pointer; font-size: calc(var(--u) * 14.5); font-weight: 700; }
.grp-h .lblbox { display: flex; flex-direction: column; min-width: 0; }
.grp-h .who { font-size: calc(var(--u) * 11); font-weight: 500; color: var(--app-muted); }
.grp-h .cnt { margin-left: auto; flex: none; font-family: var(--mono); font-size: calc(var(--u) * 11); font-weight: 500; color: var(--app-muted); }
.grp-h .chev { flex: none; color: var(--app-muted); font-size: calc(var(--u) * 15); transition: transform .25s; }
.grp.open .chev { transform: rotate(90deg); }
.grp.has-sel > .grp-h { background: var(--app-active); color: var(--app-navy); box-shadow: inset calc(var(--u) * 3) 0 0 var(--app-navy); }
.grp-items { display: flex; flex-direction: column; padding: calc(var(--u) * 4) 0 calc(var(--u) * 6); background: var(--app-sub); border-bottom: 1px solid var(--app-line); }
.mi { display: flex; align-items: baseline; gap: calc(var(--u) * 7); width: 100%; border: 0; background: transparent; color: var(--app-ink); text-align: left; cursor: pointer; padding: calc(var(--u) * 4.5) calc(var(--u) * 8) calc(var(--u) * 4.5) calc(var(--u) * 18); font-size: calc(var(--u) * 13); }
.mi .code { flex: none; min-width: calc(var(--u) * 30); font-size: calc(var(--u) * 10.5); color: var(--app-muted); }
.mi .nm { min-width: 0; overflow-wrap: anywhere; }
.mi:hover { background: var(--app-active); }
.mi.active { background: var(--app-active); color: var(--app-navy); font-weight: 700; box-shadow: inset calc(var(--u) * 3) 0 0 var(--app-navy); }
.mi .merge { flex: none; margin-left: auto; font-size: calc(var(--u) * 10.5); font-weight: 500; color: var(--app-muted); white-space: nowrap; }
.badge-new { flex: none; margin-left: auto; background: var(--app-new-bg); color: var(--app-new); font-weight: 600; font-size: calc(var(--u) * 10.5); border-radius: calc(var(--u) * 4); padding: 0 calc(var(--u) * 5); white-space: nowrap; }

.work { position: absolute; left: calc(var(--u) * 236); right: 0; top: calc(var(--u) * 46); bottom: 0; display: flex; flex-direction: column; }
.tabs { flex: none; height: calc(var(--u) * 38); display: flex; align-items: flex-end; gap: calc(var(--u) * 3); padding: 0 calc(var(--u) * 10); background: var(--app-surface); border-bottom: 1px solid var(--app-line); }
.tabs .hint { align-self: center; flex: none; margin-right: calc(var(--u) * 8); font-size: calc(var(--u) * 12.5); color: var(--app-muted); white-space: nowrap; }
.tab { display: inline-flex; align-items: center; gap: calc(var(--u) * 6); min-width: 0; max-width: calc(var(--u) * 236); height: calc(var(--u) * 30); padding: 0 calc(var(--u) * 11); border: 1px solid var(--app-line); border-bottom: 0; border-radius: calc(var(--u) * 6) calc(var(--u) * 6) 0 0; background: var(--app-bg); color: var(--app-ink); font-size: calc(var(--u) * 12.5); cursor: pointer; }
.tab .code { flex: none; font-size: calc(var(--u) * 10.5); opacity: .75; }
.tab .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab[aria-selected="true"] { background: var(--app-navy); border-color: var(--app-navy); color: var(--app-navy-ink); font-weight: 600; }
.tab:disabled { cursor: default; }
.view { position: relative; flex: 1; min-height: 0; overflow: hidden; background: var(--app-bg); }
/* 화면 사진에서 머리 줄 · 왼쪽 메뉴 · 바로가기 줄을 잘라 내고 본문만 보인다 */
.shot { position: absolute; left: calc(var(--u) * -190.4); top: calc(var(--u) * -81.6); width: calc(var(--u) * 1554.4); max-width: none; height: auto; opacity: 0; transition: opacity .28s; }
.shot.on { opacity: 1; }

  let cmpSel = null; // 처음에는 아무 대메뉴도 고르지 않은 상태

  const planScreen = () => (view === 'current' ? null : planByCode[view].get(planSel[view]));
  const selGroup = () => (view === 'current' ? byCode.get(selOld).g : planScreen().g);
  const pickPlanScreen = (v, oldCode) => { const list = DEST[v].get(oldCode); return (list.find((s) => s.code === planSel[v]) || list[0]).code; };

  // ── 왼쪽 메뉴
  function renderMenu() {
    menu.textContent = '';
    const groups = view === 'current' ? CUR_GROUPS : PLAN_GROUPS[view];
    const sg = selGroup();
    for (const g of groups) {
      const open = openSet[view].has(g.g);
      const wrap = h('div', `grp${open ? ' open' : ''}${g.g === sg ? ' has-sel' : ''}`);
      const head = btn(`grp-h${view === 'current' ? ` o${g.g}` : ''}`);
      head.dataset.g = g.g;
      head.setAttribute('aria-expanded', String(open));
      const box = h('span', 'lblbox');
      box.append(h('span', 'lbl', g.name));
      const who = view === 'current' ? '' : whoOf(g);
      if (who) box.append(h('span', 'who', who));
      head.append(box, h('span', 'cnt', g.list.length), h('span', 'chev', '›'));
      wrap.append(head);
      if (open) {
        const items = h('div', 'grp-items');
        for (const x of g.list) {
          const b = btn('mi');
          b.append(h('span', 'code', x.code), h('span', 'nm', x.name));
          if (view === 'current') {
            b.dataset.code = x.code;
            if (x.code === selOld) b.classList.add('active');
          } else {
            b.dataset.screen = x.code;
            if (x.code === planSel[view]) b.classList.add('active');
            if (x.kind === '신규') b.append(h('span', 'badge-new', '새 화면'));
            else if (x.from.length > 1) b.append(h('span', 'merge', `${x.from.length}개 합침`));
          }
          items.append(b);
        }
        wrap.append(items);
      }
      menu.append(wrap);
    }
  }

  // ── 오른쪽 화면
  function setShot(code) {
    if (shot.dataset.code === code) return;
    shot.dataset.code = code;
    shot.classList.remove('on');
    const c = byCode.get(code);
    const src = `shots/${code}.jpg`;
    const pre = new Image();
    pre.onload = () => {
      if (shot.dataset.code !== code) return;
      shot.src = src;
      shot.alt = `${c.code} ${c.name} 화면`;
      requestAnimationFrame(() => shot.classList.add('on'));
    };
    pre.src = src;
  }
  function tabEl(c, selected, clickable) {
    const b = btn(`tab o${c.g}`);
    b.setAttribute('role', 'tab');
    b.setAttribute('aria-selected', String(selected));
    b.dataset.code = c.code;
    b.title = `${c.code} ${c.name}`;
    b.disabled = !clickable;
    b.append(h('span', 'code', c.code), h('span', 'nm', c.name));
    return b;
  }
  function kpiRow(list) { const row = h('div', 'kpis'); for (const k of list) row.append(h('span', 'kpi', k)); return row; }

  function placeNote() {
    const hidden = Math.max(0, stage.getBoundingClientRect().bottom - window.innerHeight);
    const room = Math.max(0, note.parentElement.getBoundingClientRect().height - note.offsetHeight - 20);
    note.style.marginBottom = `${Math.min(hidden, room)}px`;
  }
  function renderNote(c, s) {
    drawNote(c, s);
    placeNote();
  }
  function drawNote(c, s) {
    note.textContent = '';
    note.classList.toggle('folded', noteFolded);
    const fold = btn('fold', noteFolded ? '메모 펴기' : '메모 접기');
    fold.id = 'note-fold';
    note.append(fold);
    if (noteFolded) return;
    const title = h('h3');
    if (!s) {
      title.append(h('span', 'code', c.code), document.createTextNode(c.name));
      note.append(title, h('p', null, c.desc), h('p', 'lab', '개편안에서는'));
      const go = h('dl', 'go');
      for (const v of ['plan1', 'plan2']) {
        const dd = h('dd');
        for (const t of DEST[v].get(c.code)) {
          const b = btn(null, `${t.code} ${t.name}`);
          b.dataset.go = v;
          b.dataset.screen = t.code;
          dd.append(b, h('small', null, [t.from.length > 1 ? `지금 화면 ${t.from.length}개를 합친 화면` : '화면 1개 그대로', t.who ? `주 사용자 ${t.who}` : ''].filter(Boolean).join(' · ')));
        }
        go.append(h('dt', null, LABEL[v]), dd);
      }
      note.append(go);
      return;
    }
    title.append(h('span', 'code', s.code), document.createTextNode(s.name));
    note.append(title);
    if (!s.from.length) {
      note.append(h('p', null, '지금은 없는 화면입니다. 가운데 적힌 항목으로 새로 만듭니다.'));
    } else if (s.from.length > 1) {
      note.append(h('p', null, `지금 화면 ${s.from.length}개를 한 화면으로 합칩니다. 위의 탭이 합쳐지는 화면입니다.`));
      note.append(h('p', 'sub', `지금 탭: ${c.code} ${c.name}. ${c.desc}`));
    } else {
      note.append(h('p', null, `지금의 ${c.code} ${c.name} 화면이 이 자리로 옵니다.`), h('p', 'sub', c.desc));
    }
    if (s.who) note.append(h('p', null, `주 사용자: ${s.who}`));
    if (s.add.length && s.from.length) {
      const ul = h('ul');
      for (const a of s.add) ul.append(h('li', null, a));
      note.append(h('p', 'lab', '추가 반영'), ul);
    }
    if (s.kpi.length) note.append(h('p', 'lab', '관련 평가지표'), kpiRow(s.kpi));
  }

  function renderStage() {
    const c = byCode.get(selOld);
    const s = planScreen();
    $('crumb-g').textContent = s ? s.gname : c.gname;
    $('crumb-s').textContent = s ? `${s.code} ${s.name}` : `${c.code} ${c.name}`;
    $('mode').textContent = view === 'current' ? '지금 메뉴' : `${LABEL[view]} 메뉴로 본 모습`;
    $('mode').dataset.v = view;
    tabs.textContent = '';
    const isNew = Boolean(s) && !s.from.length;
    if (!s) {
      tabs.append(tabEl(c, true, false));
    } else if (isNew) {
      tabs.append(h('span', 'hint', '새로 만드는 화면입니다. 합쳐지는 지금 화면이 없습니다.'));
    } else {
      tabs.append(h('span', 'hint', s.from.length > 1 ? `지금 화면 ${s.from.length}개가 탭으로` : '지금 화면 그대로'));
      for (const f of s.from) tabs.append(tabEl(byCode.get(f), f === selOld, s.from.length > 1));
    }
    fresh.hidden = !isNew;
    shot.hidden = isNew;
    if (isNew) {
      fresh.textContent = '';
      const t = h('h3');
      t.append(h('span', 'badge-new', '새 화면'), document.createTextNode(`${s.code} ${s.name}`));
      const wire = h('div', 'wire');
      for (const a of s.add) wire.append(h('div', null, a));
      fresh.append(t, h('p', null, '지금은 없는 화면입니다. 시트에 적힌 구성 항목을 칸으로만 놓았습니다.'), wire);
    } else {
      setShot(selOld);
      if (s) for (const f of s.from) if (f !== selOld) { const pre = new Image(); pre.src = `shots/${f}.jpg`; }
    }
    renderNote(c, s);
  }

  // ── 전체 메뉴(모든 화면을 한꺼번에)
  const ITEMS = new Map();
  for (const c of CUR) {
    const b = btn(`it o${c.g}`);
    b.dataset.code = c.code;
    b.append(h('span', 'code', c.code), h('span', 'nm', c.name));
    ITEMS.set(c.code, b);
  }
  let twins = [];
  function renderBoard() {
    for (const t of twins) t.remove();
    twins = [];
    for (const b of ITEMS.values()) { const tag = b.querySelector('.tag'); if (tag) tag.remove(); b.classList.remove('sel'); }
    board.textContent = '';
    $('allmenu-note').textContent = view === 'current'
      ? '색은 대메뉴입니다. 화면 이름을 누르면 그 화면으로 갑니다.'
      : '굵은 글씨가 새 화면이고, 그 아래 색 띠가 합쳐지는 지금 화면입니다. 색은 지금 대메뉴입니다.';
    if (view === 'current') {
      for (const g of CUR_GROUPS) {
        const panel = h('div', `panel o${g.g}`);
        const head = h('header');
        head.append(h('span', 'dot'), h('span', null, g.name), h('span', 'n', `${g.list.length}개 화면`));
        const slot = h('div', 'slot');
        for (const c of g.list) slot.append(ITEMS.get(c.code));
        panel.append(head, slot);
        board.append(panel);
      }
      ITEMS.get(selOld).classList.add('sel');
      return;
    }
    const used = new Set();
    const now = planScreen();
    for (const g of PLAN_GROUPS[view]) {
      const panel = h('div', 'panel');
      const head = h('header');
      head.append(h('span', null, g.name), h('span', 'n', `${g.list.length}개 화면`));
      const who = whoOf(g);
      if (who) head.append(h('span', 'who', `주 사용자 · ${who}`));
      panel.append(head);
      for (const s of g.list) {
        const ns = h('div', 'ns');
        ns.dataset.screen = s.code;
        const nh = btn('ns-h');
        nh.append(h('span', 'code', s.code), h('span', 'nm', s.name));
        if (s.kind === '신규') nh.append(h('span', 'badge-new', '새 화면'));
        else if (s.from.length > 1) nh.append(h('span', 'merge', `${s.from.length}개 합침`));
        ns.append(nh);
        if (!s.from.length) ns.append(h('div', 'ns-new', '지금은 없는 화면입니다.'));
        const slot = h('div', 'slot');
        for (const code of s.from) {
          let node = ITEMS.get(code);
          if (DEST[view].get(code).length > 1 && !node.querySelector('.tag')) node.append(h('span', 'tag', '나뉨'));
          if (used.has(code)) { node = node.cloneNode(true); twins.push(node); }
          used.add(code);
          node.classList.toggle('sel', s === now && code === selOld);
          slot.append(node);
        }
        if (s.from.length) ns.append(slot);
        panel.append(ns);
      }
      board.append(panel);
    }
  }
  function setAll(open) {
    allOpen = open;
    allmenu.hidden = !open;
    $('all-btn').setAttribute('aria-expanded', String(open));
    if (open) { renderBoard(); allmenu.scrollTop = 0; }
  }

  function renderText() {
    for (const v of VIEWS) $(`tab-${v}`).setAttribute('aria-selected', String(!cmpOn && v === view));
    $('tab-compare').setAttribute('aria-selected', String(cmpOn));
    if (view === 'current') {
      $('stat').textContent = `현행: 대메뉴 ${CUR_GROUPS.length}개, 화면 ${CUR.length}개`;
    } else {
      const list = PLANS[view];
      const fresh = list.filter((s) => s.kind === '신규').length;
      $('stat').textContent = `${LABEL[view]}: 대메뉴 ${PLAN_GROUPS[view].length}개, 화면 ${list.length}개 (지금 화면을 합친 것 ${list.length - fresh}개, 새 화면 ${fresh}개)`;
    }
  }
  function renderAll() {
    openSet[view].add(selGroup());
    renderMenu();
    renderStage();
    renderText();
    if (allOpen) renderBoard();
  }

  // ── 바뀌는 순간: 지금 화면마다 메뉴에서 보이는 자리(펼친 줄 또는 접힌 대메뉴 줄)
  function anchors() {
    const map = new Map();
    const heads = new Map([...menu.querySelectorAll('.grp-h')].map((el) => [Number(el.dataset.g), el]));
    const put = (code, el, kind) => { if (el && !(map.has(code) && map.get(code).kind === 'item')) map.set(code, { rect: el.getBoundingClientRect(), kind }); };
    if (view === 'current') {
      const rows = new Map([...menu.querySelectorAll('.mi')].map((el) => [el.dataset.code, el]));
      for (const c of CUR) { if (rows.has(c.code)) put(c.code, rows.get(c.code), 'item'); else put(c.code, heads.get(c.g), 'group'); }
    } else {
      const rows = new Map([...menu.querySelectorAll('.mi')].map((el) => [el.dataset.screen, el]));
      for (const s of PLANS[view]) for (const f of s.from) { if (rows.has(s.code)) put(f, rows.get(s.code), 'item'); else put(f, heads.get(s.g), 'group'); }
    }
    return map;
  }
  function flyGhosts(before, after) {
    const unit = stage.getBoundingClientRect().width / 1600;
    const menuBox = menu.getBoundingClientRect();
    let n = 0;
    for (const c of CUR) {
      const a = before.get(c.code), b = after.get(c.code);
      if (!a || !b || (a.kind === 'group' && b.kind === 'group')) continue;
      const height = 25 * unit;
      const width = Math.min(a.rect.width, b.rect.width) - 12 * unit;
      const startTop = a.rect.top + (a.rect.height - height) / 2;
      const endTop = b.rect.top + (b.rect.height - height) / 2;
      if (Math.max(startTop, endTop) < menuBox.top - 40 || Math.min(startTop, endTop) > menuBox.bottom + 40) continue;
      const g = h('div', `ghost o${c.g}`, `${c.code} ${c.name}`);
      g.style.left = `${a.rect.left + 6 * unit}px`;
      g.style.top = `${startTop}px`;
      g.style.width = `${width}px`;
      g.style.height = `${height}px`;
      g.style.fontSize = `${12.5 * unit}px`;
      document.body.append(g);
      const anim = g.animate([
        { transform: 'translate(0, 0) scale(1)', opacity: a.kind === 'group' ? 0 : 1 },
        { opacity: 1, offset: 0.18 },
        { opacity: 1, offset: 0.78 },
        { transform: `translate(${b.rect.left - a.rect.left}px, ${endTop - startTop}px) scale(${b.kind === 'group' ? 0.72 : 1})`, opacity: 0 },
      ], { duration: 900, delay: Math.min(n, 26) * 24, easing: 'cubic-bezier(.45, 0, .12, 1)', fill: 'both' });
      const done = () => g.remove();
      anim.onfinish = done;
      anim.oncancel = done;
      n += 1;
    }
  }
  function flipBoard(first) {
    board.classList.add('entering');
    for (const el of board.querySelectorAll('.it')) {
      const from = first.get(el.dataset.code);
      const to = el.getBoundingClientRect();
      const dx = from.left - to.left, dy = from.top - to.top;
      if (Math.abs(dx) < 1 && Math.abs(dy) < 1) continue;
      const c = byCode.get(el.dataset.code);
      el.classList.add('flying');
      const anim = el.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: 'translate(0, 0)' }], { duration: 950, delay: (c.g - 1) * 28 + c.i * 10, easing: 'cubic-bezier(.45, 0, .12, 1)', fill: 'backwards' });
      const done = () => el.classList.remove('flying');
      anim.onfinish = done;
      anim.oncancel = done;
    }
    clearTimeout(boardTimer);
    boardTimer = setTimeout(() => board.classList.remove('entering'), 1600);
  }

  function apply(next, animate) {
    if (!VIEWS.includes(next) || next === view) return;
    const fly = animate && !reduceMotion() && typeof stage.animate === 'function';
    let before = null, first = null;
    if (fly && allOpen) { first = new Map(); for (const [code, el] of ITEMS) first.set(code, el.getBoundingClientRect()); }
    else if (fly) before = anchors();
    for (const el of board.querySelectorAll('.it')) { for (const a of el.getAnimations()) a.cancel(); el.classList.remove('flying'); }
    for (const g of document.querySelectorAll('.ghost')) g.remove();
    const prev = planScreen();
    if (next !== 'current') {
      const twin = prev && !prev.from.length ? PLANS[next].find((s) => s.kind === '신규' && s.name === prev.name) : null;
      planSel[next] = twin ? twin.code : pickPlanScreen(next, selOld);
    }
    view = next;
    openSet[view] = new Set();
    renderAll();
    if (!fly) return;
    if (allOpen) flipBoard(first); else flyGhosts(before, anchors());
    menu.classList.add('enter');
    stage.classList.add('swap');
    clearTimeout(enterTimer);
    clearTimeout(swapTimer);
    enterTimer = setTimeout(() => menu.classList.remove('enter'), 1700);
    swapTimer = setTimeout(() => stage.classList.remove('swap'), 900);
  }

  function selectPlan(code) {
    const s = planByCode[view].get(code);
    if (!s) return;
    planSel[view] = code;
    if (s.from.length && !s.from.includes(selOld)) selOld = s.from[0];
  }

  // ── 누르기
  menu.addEventListener('click', (e) => {
    const head = e.target.closest('.grp-h');
    if (head) {
      const g = Number(head.dataset.g);
      if (openSet[view].has(g)) openSet[view].delete(g); else openSet[view].add(g);
      renderMenu();
      const again = menu.querySelector(`.grp-h[data-g="${g}"]`);
      if (again) again.focus({ preventScroll: true });
      return;
    }
    const item = e.target.closest('.mi');
    if (!item) return;
    if (item.dataset.code) selOld = item.dataset.code; else selectPlan(item.dataset.screen);
    if (allOpen) setAll(false);
    renderAll();
    const again = menu.querySelector('.mi.active');
    if (again) again.focus({ preventScroll: true });
  });
  tabs.addEventListener('click', (e) => {
    const tab = e.target.closest('.tab');
    if (!tab || tab.disabled || view === 'current') return;
    selOld = tab.dataset.code;
    renderStage();
    if (allOpen) renderBoard();
    const again = tabs.querySelector('.tab[aria-selected="true"]');
    if (again) again.focus({ preventScroll: true });
  });
  note.addEventListener('click', (e) => {
    if (e.target.closest('.fold')) { noteFolded = !noteFolded; renderNote(byCode.get(selOld), planScreen()); $('note-fold').focus({ preventScroll: true }); return; }
    const go = e.target.closest('[data-go]');
    if (!go) return;
    planSel[go.dataset.go] = go.dataset.screen;
    setView(go.dataset.go);
  });
  $('all-btn').addEventListener('click', () => setAll(!allOpen));
  $('all-close').addEventListener('click', () => { setAll(false); $('all-btn').focus({ preventScroll: true }); });
  board.addEventListener('click', (e) => {
    const it = e.target.closest('.it');
    const nh = e.target.closest('.ns-h');
    if (it) {
      if (view !== 'current') planSel[view] = it.closest('.ns').dataset.screen;
      selOld = it.dataset.code;
    } else if (nh) {
      selectPlan(nh.closest('.ns').dataset.screen);
    } else return;
    openSet[view] = new Set();
    setAll(false);
    renderAll();
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && allOpen) setAll(false); });
  window.addEventListener('scroll', placeNote, { passive: true });
  window.addEventListener('resize', placeNote);

  // ── 대메뉴만 나란히: 세 메뉴의 대메뉴 줄. 줄마다 그 안에 든 「지금 화면」 묶음을 들고 있다
  const CMP = VIEWS.map((v) => ({
    v,
    screens: v === 'current' ? CUR.length : PLANS[v].length,
    groups: (v === 'current' ? CUR_GROUPS : PLAN_GROUPS[v]).map((g) => ({
      g: g.g, name: g.name, n: g.list.length, who: v === 'current' ? '' : whoOf(g),
      fresh: v === 'current' ? 0 : g.list.filter((x) => !x.from.length).length,
      set: new Set(v === 'current' ? g.list.map((c) => c.code) : g.list.flatMap((x) => x.from)),
      items: g.list.map((x) => ({ code: x.code, name: x.name, extra: v === 'current' ? '' : !x.from.length ? '새 화면' : x.from.length > 1 ? `${x.from.length}개 합침` : '' })),
      el: null,
    })),
  }));
  const ORDER = new Map(CUR.map((c, i) => [c.code, i]));
  // 가운데가 현행, 왼쪽 1안, 오른쪽 2안
  const CMP_SHOWN = ['plan1', 'current', 'plan2'].map((v) => CMP.find((c) => c.v === v));
  const cmpLane = { plan1: {}, plan2: {} };
  let cmpSvg = null;
  let cmpPlan = [];
  const NS = 'http://www.w3.org/2000/svg';
  function buildCmp() {
    const grid = $('cmp-grid');
    cmpSvg = document.createElementNS(NS, 'svg');
    cmpSvg.setAttribute('class', 'cmp-lines');
    cmpSvg.setAttribute('aria-hidden', 'true');
    grid.append(cmpSvg);
    // 사이 칸 하나 = 두 단. 개편안 창 옆 단에는 개편 화면, 현행 창 옆 단에는 현행 화면
    const link = (side, order) => {
      const box = h('div', 'cmp-link');
      for (const kind of order) {
        const lane = h('div', 'cmp-lane');
        lane.dataset.v = kind === 'plan' ? side : 'current';
        const cap = h('div', 'cmp-cap');
        cap.append(h('span', null, kind === 'plan' ? `${LABEL[side]} 화면` : '현행 화면'));
        lane.append(cap);
        cmpLane[side][kind] = lane;
        box.append(lane);
      }
      grid.append(box);
    };
    for (const col of CMP_SHOWN) {
      if (col.v === 'current') link('plan1', ['plan', 'cur']);
      const win = h('div', 'cmp-win');
      win.dataset.v = col.v;
      const head = h('div', 'cmp-head', LABEL[col.v]);
      head.append(h('span', null, '마실케어 메뉴'));
      const nav = h('nav');
      nav.setAttribute('aria-label', `${LABEL[col.v]} 대메뉴`);
      for (const g of col.groups) {
        const b = btn('grp-h cmp-row');
        b.dataset.v = col.v;
        b.dataset.g = g.g;
        const lbl = h('span', 'lblbox');
        lbl.append(h('span', 'lbl', g.name));
        if (g.who) lbl.append(h('span', 'who', g.who));
        b.append(lbl, h('span', 'cnt', g.n));
        g.el = b;
        nav.append(b);
      }
      win.append(head, h('div', 'cmp-sub', `대메뉴 ${col.groups.length}개 · 화면 ${col.screens}개`), nav);
      grid.append(win);
      if (col.v === 'current') link('plan2', ['cur', 'plan']);
    }
    grid.addEventListener('click', (e) => {
      const row = e.target.closest('.cmp-row');
      if (!row) return;
      const g = Number(row.dataset.g);
      cmpSel = cmpSel && cmpSel.v === row.dataset.v && cmpSel.g === g ? null : { v: row.dataset.v, g };
      paintCmp();
    });
    // 화면 줄에 올리면 그 화면이 속한 통합 묶음 전체를 진하게 —
    // 개편 화면이면 그 화면과 합쳐지는 현행 화면 전부, 현행 화면이면 같은 개편 화면으로 함께 합쳐지는 현행 화면 전부(1안 · 2안 양쪽)
    const focus = (li) => {
      for (const el of grid.querySelectorAll('li.hot')) el.classList.remove('hot');
      const paths = [...cmpSvg.querySelectorAll('path.pair')];
      const groups = new Set();
      if (li && li.dataset.kind === 'plan') groups.add(`${li.dataset.side}|${li.dataset.key}`);
      else if (li) for (const path of paths) if (path.dataset.cur === li.dataset.key) groups.add(`${path.dataset.side}|${path.dataset.plan}`);
      cmpSvg.classList.toggle('focus', Boolean(li));
      grid.classList.toggle('focusing', Boolean(li));
      for (const path of paths) {
        const on = groups.has(`${path.dataset.side}|${path.dataset.plan}`);
        path.classList.toggle('hot', on);
        if (!on) continue;
        for (const [kind, key] of [['plan', path.dataset.plan], ['cur', path.dataset.cur]]) {
          const el = grid.querySelector(`li[data-side="${path.dataset.side}"][data-kind="${kind}"][data-key="${key}"]`);
          if (el) el.classList.add('hot');
        }
      }
      if (li) li.classList.add('hot');
    };
    grid.addEventListener('pointerover', (e) => focus(e.target.closest('.cmp-box li')));
    grid.addEventListener('pointerleave', () => focus(null));
    $('cmp-say').addEventListener('click', (e) => { if (e.target.closest('button')) { cmpSel = null; paintCmp(); } });
    let lastWidth = 0;
    if (typeof ResizeObserver === 'function') new ResizeObserver(() => { const w = grid.clientWidth; if (w !== lastWidth) { lastWidth = w; layoutCmp(false); } }).observe(grid);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => layoutCmp(false));
  }
  // 상자 하나 = 대메뉴 하나. 안의 줄 = 화면(개편 화면이면 「통합 N」 · 「신규」 표시)
  const TONES = ['#1f3a6e', '#0e7c66', '#8a4fb0', '#b3541e', '#2a78c2', '#a23b63'];
  function cmpBox(side, kind, title, items, toneOf) {
    const box = h('div', 'cmp-box');
    const head = h('h4', null, title);
    head.append(h('small', null, `${items.length}개`));
    const ul = h('ul');
    const lines = new Map();
    for (const x of items) {
      const li = h('li', kind === 'plan' && !x.from.length ? 'is-new' : null);
      li.dataset.side = side;
      li.dataset.kind = kind;
      li.dataset.key = x.code;
      const tone = toneOf(x.code);
      if (tone) li.style.setProperty('--tone', tone);
      li.append(h('span', 'code', x.code), h('span', 'nm', x.name));
      if (kind === 'plan' && x.from.length !== 1) li.append(h('span', 'tag', x.from.length ? `통합 ${x.from.length}` : '신규'));
      ul.append(li);
      lines.set(x.code, li);
    }
    box.append(head, ul);
    return { box, lines };
  }
  const colOf = (v) => CMP.find((c) => c.v === v);
  function paintCmp() {
    const say = $('cmp-say');
    const picked = cmpSel ? colOf(cmpSel.v).groups.find((g) => g.g === cmpSel.g) : null;
    $('cmp').classList.toggle('picked', Boolean(picked));
    for (const col of CMP) for (const g of col.groups) {
      g.el.classList.toggle('sel', picked === g);
      g.el.classList.remove('rel');
      g.el.setAttribute('aria-pressed', String(picked === g));
    }
    for (const side of ['plan1', 'plan2']) for (const kind of ['plan', 'cur']) for (const el of cmpLane[side][kind].querySelectorAll('.cmp-box')) el.remove();
    cmpPlan = [];
    if (picked) {
      // 현행을 고르면 양쪽(1안 · 2안), 1안이나 2안을 고르면 그쪽과 현행 사이에만 그린다
      for (const side of cmpSel.v === 'current' ? ['plan1', 'plan2'] : [cmpSel.v]) {
        const planCol = colOf(side);
        const curCol = colOf('current');
        // 개편 화면: 개편안을 골랐으면 그 대메뉴의 화면 전부(신규 포함), 현행을 골랐으면 그 화면을 받는 개편 화면
        const screens = cmpSel.v === 'current' ? PLANS[side].filter((x) => x.from.some((f) => picked.set.has(f))) : PLAN_GROUPS[side].find((g) => g.g === picked.g).list;
        // 개편 화면마다 색 하나 — 그 화면의 줄, 합쳐지는 현행 화면의 줄, 잇는 선이 같은 색이다
        const tone = new Map(screens.map((x, i) => [x.code, x.from.length ? TONES[i % TONES.length] : '#8a5200']));
        const toneOfCur = (code) => { const x = screens.find((t) => t.from.includes(code)); return x ? tone.get(x.code) : ''; };
        const planBoxes = [];
        for (const g of planCol.groups) {
          const list = screens.filter((x) => x.g === g.g);
          if (!list.length) continue;
          if (g !== picked) g.el.classList.add('rel');
          planBoxes.push({ ...cmpBox(side, 'plan', g.name, list, (code) => tone.get(code)), row: g.el });
        }
        const curBoxes = [];
        for (const g of curCol.groups) {
          const codes = [...picked.set].filter((code) => g.set.has(code)).sort((a, b) => ORDER.get(a) - ORDER.get(b));
          if (!codes.length) continue;
          if (g !== picked) g.el.classList.add('rel');
          curBoxes.push({ ...cmpBox(side, 'cur', g.name, codes.map((code) => byCode.get(code)), toneOfCur), row: g.el });
        }
        for (const b of planBoxes) cmpLane[side].plan.append(b.box);
        for (const b of curBoxes) cmpLane[side].cur.append(b.box);
        const pairs = [];
        for (const x of screens) for (const f of x.from) if (picked.set.has(f)) pairs.push([x.code, f, tone.get(x.code)]);
        cmpPlan.push({ side, lanes: [{ lane: cmpLane[side].plan, boxes: planBoxes }, { lane: cmpLane[side].cur, boxes: curBoxes }], pairs });
      }
    }
    say.textContent = '';
    if (!picked) {
      say.append('대메뉴 비교(왼쪽 1안 · 가운데 현행 · 오른쪽 2안).', h('br'), '대메뉴를 선택하면 통합 · 이동되는 화면이 사이에 표시됩니다.');
    } else {
      say.append('선택: ', h('b', null, `${LABEL[cmpSel.v]} ${picked.name}`));
      if (cmpSel.v === 'current') say.append(` — 현행 화면 ${picked.set.size}개가 통합되는 1안 · 2안 화면`);
      else say.append(` — 개편 화면 ${picked.n}개와 통합 대상 현행 화면 ${picked.set.size}개${picked.fresh ? ` (신규 화면 ${picked.fresh}개는 현행 해당 없음)` : ''}`);
      say.append(btn(null, '선택 해제'));
    }
    renderInfo(picked);
    layoutCmp(true);
  }
  // ── 그림 아래 설명: 구성 개요 표와 화면별 표
  const WHY = D.why;
  function chips(list) { const row = h('div', 'ci-chips'); for (const k of list) row.append(h('span', null, k)); return row; }
  function cell(tag, content, cls, span) {
    const td = h(tag, cls || null);
    if (span > 1) td.rowSpan = span;
    for (const c of [].concat(content)) td.append(c);
    return td;
  }
  function table(heads, wide) {
    const wrap = h('div', 'ci-wrap');
    const t = h('table', `ci-t${wide ? ' wide' : ''}`);
    if (heads) { const tr = h('tr'); for (const x of heads) tr.append(h('th', null, x)); const thead = h('thead'); thead.append(tr); t.append(thead); }
    const body = h('tbody');
    t.append(body);
    wrap.append(t);
    return { wrap, body };
  }
  const screenLabel = (code, name) => { const f = document.createDocumentFragment(); f.append(h('span', 'code', code), h('span', 'name', name)); return f; };
  const none = (text) => h('span', 'none', text || '—');
  function renderInfo(picked) {
    const box = $('cmp-info');
    box.textContent = '';
    box.hidden = !picked;
    if (!picked) return;
    const v = cmpSel.v;
    const title = h('h2');
    const tag = h('span', 'tag', LABEL[v]);
    if (v !== 'current') tag.style.color = `var(--lbl-${v})`;
    title.append(tag, document.createTextNode(picked.name));
    box.append(title);
    if (v === 'current') {
      // 표 1 — 개편안별 이동 개요
      const a = table(['개편안', '이동 대메뉴', '화면 수', '해당 대메뉴의 구성 기준']);
      for (const side of ['plan1', 'plan2']) {
        const targets = colOf(side).groups.map((g) => ({ g, n: [...picked.set].filter((code) => g.set.has(code)).length })).filter((t) => t.n);
        targets.forEach((t, i) => {
          const tr = h('tr');
          if (!i) tr.append(cell('th', LABEL[side], null, targets.length));
          tr.append(cell('td', h('span', 'name', t.g.name)), cell('td', `${t.n}개`, 'num'), cell('td', WHY[side][t.g.g]));
          a.body.append(tr);
        });
      }
      // 표 2 — 화면별 이동 내역
      const b = table(['현행 화면', '화면 기능', '1안 이동 위치', '2안 이동 위치'], true);
      for (const c of CUR_GROUPS.find((g) => g.g === picked.g).list) {
        const tr = h('tr');
        tr.append(cell('td', screenLabel(c.code, c.name)), cell('td', c.desc));
        for (const side of ['plan1', 'plan2']) {
          const td = h('td');
          DEST[side].get(c.code).forEach((t, i) => {
            if (i) td.append(h('br'));
            td.append(h('span', 'sub', `${t.gname} › `), screenLabel(t.code, t.name));
          });
          tr.append(td);
        }
        b.body.append(tr);
      }
      box.append(h('h3', null, `개편안별 이동 개요 (화면 ${picked.n}개)`), a.wrap, h('h3', null, '화면별 이동 내역'), b.wrap);
    } else {
      const group = PLAN_GROUPS[v].find((g) => g.g === picked.g);
      const from = CUR_GROUPS.map((g) => ({ g, n: g.list.filter((c) => picked.set.has(c.code)).length })).filter((t) => t.n);
      const kpi = [...new Set(group.list.flatMap((x) => x.kpi.map((k) => k.split(' — ')[0])))];
      // 표 1 — 구성 개요
      const a = table(null);
      const row = (label, value) => { const tr = h('tr'); tr.append(cell('th', label), cell('td', value)); a.body.append(tr); };
      row('구성 기준', WHY[v][picked.g]);
      row('통합 대상', from.length ? `${from.map((t) => `현행 ${t.g.name} ${t.n}개`).join(', ')} (계 ${picked.set.size}개)` : none('없음'));
      row('개편 화면', `${picked.n}개 (통합 ${picked.n - picked.fresh}개, 신규 ${picked.fresh}개)`);
      if (picked.who) row('주 사용자', picked.who);
      row('관련 평가지표', kpi.length ? chips(kpi) : none('시트에 기재 없음'));
      // 표 2 — 화면별 구성
      const b = table(['개편 화면', '통합 대상 현행 화면', '현행 대메뉴', '화면 기능', '추가 반영 항목'], true);
      for (const x of group.list) {
        const span = Math.max(1, x.from.length);
        const name = document.createDocumentFragment();
        name.append(screenLabel(x.code, x.name), h('span', `kind${x.from.length ? '' : ' new'}`, x.from.length ? '통합' : '신규'));
        let add = none();
        if (x.add.length) { add = h('ul'); for (const item of x.add) add.append(h('li', null, item)); }
        if (!x.from.length) {
          const tr = h('tr');
          tr.append(cell('td', name), cell('td', none('해당 없음(신규 화면)')), cell('td', none()), cell('td', none()), cell('td', add));
          b.body.append(tr);
          continue;
        }
        x.from.forEach((f, i) => {
          const c = byCode.get(f);
          const tr = h('tr');
          if (!i) tr.append(cell('td', name, null, span));
          tr.append(cell('td', screenLabel(c.code, c.name)), cell('td', c.gname, 'sub'), cell('td', c.desc));
          if (!i) tr.append(cell('td', add, null, span));
          b.body.append(tr);
        });
      }
      box.append(h('h3', null, '구성 개요'), a.wrap, h('h3', null, `화면별 구성 (개편 화면 ${picked.n}개)`), b.wrap);
    }
    box.append(h('p', 'ci-src', '※ 구성 기준은 시트의 화면 구성, 주 사용자, 관련 평가지표를 근거로 정리한 내용입니다. 개편안 원문의 사유 설명은 시트에 포함되어 있지 않습니다.'));
  }
  // 상자를 이어진 대메뉴 줄 높이에 맞춰 놓고(겹치면 아래로 밀고, 넘치면 위로 당긴다) 선을 긋는다
  function layoutCmp(animate) {
    if (!cmpSvg || !cmpOn) return;
    const grid = $('cmp-grid');
    cmpSvg.textContent = '';
    cmpSvg.classList.remove('focus');
    grid.classList.remove('focusing');
    cmpSvg.classList.toggle('still', !animate);
    const pad = parseFloat(getComputedStyle(grid).paddingTop);
    const gap = pad * 0.7;
    const head = pad * 1.9;
    const lanes = cmpPlan.flatMap((p) => p.lanes);
    for (const side of ['plan1', 'plan2']) for (const kind of ['plan', 'cur']) cmpLane[side][kind].style.minHeight = '';
    // 1) 단마다 상자 높이를 재고, 모자라면 단을 늘린다
    for (const l of lanes) {
      for (const b of l.boxes) b.height = b.box.offsetHeight;
      l.total = head + l.boxes.reduce((sum, b) => sum + b.height, 0) + gap * Math.max(0, l.boxes.length - 1);
      if (l.total > l.lane.clientHeight) l.lane.style.minHeight = `${Math.ceil(l.total)}px`;
    }
    // 2) 자리 잡기
    for (const l of lanes) {
      const top0 = l.lane.getBoundingClientRect().top;
      const list = l.boxes.map((b) => { const ref = b.row.getBoundingClientRect(); b.top = ref.top + ref.height / 2 - top0 - b.height / 2; return b; }).sort((a, b) => a.top - b.top);
      let y = head;
      for (const b of list) { b.top = Math.max(b.top, y); y = b.top + b.height + gap; }
      let limit = Math.max(l.lane.clientHeight, l.total);
      for (let i = list.length - 1; i >= 0; i -= 1) { list[i].top = Math.min(list[i].top, limit - list[i].height); limit = list[i].top - gap; }
      for (const b of list) { b.top = Math.max(head, b.top); b.box.style.top = `${b.top}px`; b.lane = l.lane; }
    }
    const frame = grid.getBoundingClientRect();
    cmpSvg.setAttribute('width', frame.width);
    cmpSvg.setAttribute('height', frame.height);
    cmpSvg.setAttribute('viewBox', `0 0 ${frame.width} ${frame.height}`);
    const line = (a, b, cls, data, color) => {
      // a · b = { left, right, y } — 마주 보는 변끼리 잇는다
      const leftFirst = a.left < b.left;
      const x1 = (leftFirst ? a.right : a.left) - frame.left;
      const x2 = (leftFirst ? b.left : b.right) - frame.left;
      const y1 = a.y - frame.top;
      const y2 = b.y - frame.top;
      const mid = (x1 + x2) / 2;
      const path = document.createElementNS(NS, 'path');
      path.setAttribute('d', `M${x1} ${y1} C${mid} ${y1} ${mid} ${y2} ${x2} ${y2}`);
      path.setAttribute('pathLength', '1');
      if (cls) path.setAttribute('class', cls);
      if (data) for (const [k, val] of Object.entries(data)) path.dataset[k] = val;
      if (color) path.style.stroke = color;
      cmpSvg.append(path);
      if (cls) return path;
      for (const [cx, cy] of [[x1, y1], [x2, y2]]) {
        const dot = document.createElementNS(NS, 'circle');
        if (color) dot.style.fill = color;
        dot.setAttribute('cx', cx);
        dot.setAttribute('cy', cy);
        dot.setAttribute('r', 3);
        cmpSvg.append(dot);
      }
      return path;
    };
    // 상자 · 화면 줄의 자리는 떠오르는 움직임과 상관없는 값(offset)으로 잰다
    const boxAt = (b, li) => {
      const at = b.lane.getBoundingClientRect();
      const left = at.left + b.box.offsetLeft;
      return { left, right: left + b.box.offsetWidth, y: at.top + b.top + (li ? li.offsetTop + li.offsetHeight / 2 : b.height / 2) };
    };
    const rowAt = (el) => { const r = el.getBoundingClientRect(); return { left: r.left, right: r.right, y: r.top + r.height / 2 }; };
    for (const p of cmpPlan) {
      const [planLane, curLane] = p.lanes;
      for (const l of p.lanes) for (const b of l.boxes) line(rowAt(b.row), boxAt(b));
      const find = (lane, code) => { for (const b of lane.boxes) { const li = b.lines.get(code); if (li) return boxAt(b, li); } return null; };
      for (const [screen, code, tone] of p.pairs) {
        const a = find(planLane, screen);
        const b = find(curLane, code);
        if (a && b) line(a, b, 'pair', { side: p.side, plan: screen, cur: code }).style.stroke = tone;
      }
    }
  }
  function setCmp(on) {
    cmpOn = on;
    $('cmp').hidden = !on;
    $('intro').hidden = on;
    $('stage-scroll').hidden = on;
    $('legend').hidden = on;
    renderText();
    if (on) paintCmp(); else placeNote();
  }

  // ── 보기 고르기 — 주소의 #current · #plan1 · #plan2 · #compare 와 맞춘다
  const fromHash = () => { const name = location.hash.replace('#', ''); return name === 'compare' || VIEWS.includes(name) ? name : ''; };
  const ONLY_COMPARE = true; // 목업(현행 · 1안 · 2안) 보기는 닫아 둔다
  function show(name, animate) {
    if (name === 'compare') { if (!cmpOn) setCmp(true); return; }
    if (ONLY_COMPARE) return;
    const was = cmpOn;
    if (was) setCmp(false);
    apply(name, animate && !was);
  }
  function setView(v) {
    show(v, true);
    try { if (fromHash() !== v) location.hash = v; } catch (error) { /* 주소를 못 바꿔도 보기는 바뀐다 */ }
  }
  for (const v of VIEWS) $(`tab-${v}`).addEventListener('click', () => setView(v));
  $('tab-compare').addEventListener('click', () => setView('compare'));
  window.addEventListener('hashchange', () => { const name = fromHash(); if (name) show(name, true); });

  $('n-current').textContent = CUR.length;
  $('n-plan1').textContent = D.p1.length;
  $('n-plan2').textContent = D.p2.length;
  const legend = $('legend');
  legend.append(h('span', null, '「전체 메뉴」에서 띠 색은 그 화면이 지금 들어 있는 대메뉴입니다:'));
  for (const g of CUR_GROUPS) { const s = h('span', `o${g.g}`); s.append(h('span', 'dot'), document.createTextNode(g.name)); legend.append(s); }

  buildCmp();
  const start = fromHash();
  if (ONLY_COMPARE) {
    setCmp(true);
  } else {
    if (start && start !== 'current' && start !== 'compare') { planSel[start] = pickPlanScreen(start, selOld); view = start; }
    renderAll();
    if (start === 'compare') setCmp(true);
  }
})();
</script>
</body>
